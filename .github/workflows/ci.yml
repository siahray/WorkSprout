name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Linters (ESLint & Oxlint)
        run: |
          bun run lint
          bunx oxlint

      - name: Type Check
        # Route types (PageProps, LayoutProps, …) are generated, not checked in:
        # a fresh checkout has no .next, so tsc alone fails on LayoutProps.
        run: |
          bunx next typegen
          bun run typecheck
          bun run test:types

      - name: Run Tests
        run: bun run test

      - name: Build Next.js App
        run: bun run build