name: CodeQL Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        # One combined identifier. TypeScript is analysed by the JavaScript
        # extractor — there is no separate `typescript` language, and listing it
        # alongside `javascript` registers a *different* configuration from the
        # one on `main`. That mismatch is what makes the "Code scanning results"
        # check report "1 configuration not found" and block the pull request.
        languages: javascript-typescript

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        # Must match the category used on `main` (including by default setup) or
        # the analyses are treated as unrelated configurations.
        category: "/language:javascript-typescript"
